<section id="start" class="card center"><div style="font-size:68px">👁️</div><h1>MISIÓN <span class="green">OFTALMO</span></h1><p class="sub">Nivel 01 · Fundamentos Clínicos</p><div class="box"><b>👤 Nombre o apodo</b><input id="name" type="text" maxlength="35" placeholder="Ej.: Camila R."><label class="check"><input id="ranking" type="checkbox" checked><span><b>🏆 Quiero participar en el Ranking UAPO LAB</b><br><small>La conexión al ranking global se incorporará posteriormente.</small></span></label></div><p>⏱️ 45 segundos · ❤️ 3 vidas · 🏆 100 puntos por respuesta correcta</p><button class="go" onclick="startGame()">COMENZAR MISIÓN →</button></section>

const Q=[{"topic": "GES", "q": "¿Cuál asociación corresponde correctamente a un problema GES oftalmológico?", "a": ["Estrabismo — menores de 15 años", "Vicios de refracción — 60 años y más", "Estrabismo — menores de 9 años", "Vicios de refracción — 70 años y más"], "c": 2, "e": "GES contempla estrabismo en menores de 9 años; los vicios de refracción consideran personas de 65 años y más."}, {"topic": "GES", "q": "Paciente de 66 años requiere corrección óptica por un vicio de refracción. ¿Cuál afirmación es correcta respecto al GES?", "a": ["No corresponde a GES", "Corresponde, porque tiene 65 años o más", "Solo corresponde si además presenta catarata", "Solo corresponde si su AV es menor a 20/200"], "c": 1, "e": "Los vicios de refracción en personas de 65 años y más constituyen un problema de salud GES."}, {"topic": "GES", "q": "¿Qué cuadro corresponde específicamente al problema GES de desprendimiento de retina?", "a": ["Desprendimiento traccional secundario a retinopatía diabética", "Desprendimiento regmatógeno postraumático", "Desprendimiento exudativo inflamatorio", "Desprendimiento de retina regmatógeno no traumático"], "c": 3, "e": "El problema GES corresponde específicamente al desprendimiento de retina regmatógeno no traumático."}, {"topic": "GES", "q": "Paciente diabético presenta microaneurismas, hemorragias intrarretinales y exudados, sin neovascularización. ¿Cuál es la interpretación más correcta?", "a": ["Compatible con retinopatía diabética no proliferativa", "La ausencia de neovasos descarta retinopatía diabética", "Es necesariamente retinopatía diabética proliferativa", "Debe existir desprendimiento retinal para hablar de retinopatía diabética"], "c": 0, "e": "Sin neovascularización, estos hallazgos son compatibles con retinopatía diabética no proliferativa."}, {"topic": "GES", "q": "¿Cuál paciente corresponde claramente a una condición oftalmológica contemplada por GES según edad y diagnóstico?", "a": ["Niño de 11 años con estrabismo", "Adulto de 58 años con presbicia", "Niño de 7 años con estrabismo", "Adulto de 63 años con vicio de refracción"], "c": 2, "e": "El estrabismo en menores de 9 años está contemplado por GES."}, {"topic": "Glaucoma", "q": "Un paciente presenta PIO de 25 mmHg en ambos ojos. ¿Cuál interpretación es más correcta?", "a": ["Confirma glaucoma por sí sola", "Es un factor de riesgo; se debe integrar con nervio óptico y otros hallazgos", "Descarta glaucoma porque el daño aparece sobre 30 mmHg", "Solo diagnostica glaucoma si hay dolor"], "c": 1, "e": "La PIO elevada es un factor de riesgo importante y modificable, pero no basta por sí sola para diagnosticar glaucoma."}, {"topic": "Glaucoma", "q": "¿Qué hallazgo del nervio óptico genera mayor sospecha de daño glaucomatoso?", "a": ["Excavación aumentada y asimetría papilar sospechosa", "Bordes difusamente elevados y borrados", "Palidez marcada con excavación pequeña", "Drusas maculares aisladas"], "c": 0, "e": "El glaucoma puede producir aumento de la excavación y adelgazamiento del anillo neurorretinal; debe interpretarse en contexto."}, {"topic": "Glaucoma", "q": "¿Qué hallazgo campimétrico es más compatible con daño glaucomatoso?", "a": ["Escotoma arcuato que respeta típicamente el meridiano horizontal", "Hemianopsia bitemporal", "Hemianopsia homónima derecha", "Escotoma central aislado como patrón inicial característico"], "c": 0, "e": "El glaucoma puede producir escalón nasal, escotomas paracentrales y arcuatos."}, {"topic": "Glaucoma", "q": "Paciente 1: pérdida progresiva e indolora del campo visual. Paciente 2: dolor ocular súbito, halos, cefalea y náuseas. ¿Cuál asociación es más probable?", "a": ["Paciente 1: glaucoma agudo / Paciente 2: ángulo abierto", "Paciente 1: ángulo abierto / Paciente 2: cierre angular agudo", "Ambos corresponden a glaucoma agudo", "Ambos corresponden a glaucoma de ángulo abierto"], "c": 1, "e": "El glaucoma de ángulo abierto suele ser silencioso y progresivo; el cierre angular agudo es sintomático y urgente."}, {"topic": "Glaucoma", "q": "Mujer de 64 años presenta baja visual unilateral súbita, dolor intenso, cefalea, náuseas, halos, semimidriasis poco reactiva y PIO OD 54 mmHg / OI 16 mmHg. ¿Diagnóstico más probable?", "a": ["Uveítis anterior aguda", "Queratitis aguda", "Glaucoma agudo por cierre angular", "Escleritis anterior"], "c": 2, "e": "La combinación clínica y la PIO marcadamente elevada son altamente sugerentes de cierre angular agudo."}, {"topic": "Farmacología", "q": "Un paciente inicia latanoprost. ¿Cuál es su principal mecanismo hipotensor?", "a": ["Bloqueo β y menor producción de humor acuoso", "Aumento de la salida uveoescleral", "Inhibición de anhidrasa carbónica", "Miosis por contracción del músculo ciliar"], "c": 1, "e": "Latanoprost es un análogo de prostaglandina que aumenta principalmente la salida uveoescleral."}, {"topic": "Farmacología", "q": "Paciente con glaucoma y asma bronquial. ¿Qué fármaco requiere especial precaución?", "a": ["Latanoprost", "Brinzolamida", "Timolol", "Brimonidina"], "c": 2, "e": "Timolol es un betabloqueador no selectivo y puede producir broncoespasmo por absorción sistémica."}, {"topic": "Farmacología", "q": "¿Qué colirio reduce la producción de humor acuoso mediante inhibición de la anhidrasa carbónica?", "a": ["Latanoprost", "Dorzolamida", "Timolol", "Brimonidina"], "c": 1, "e": "Dorzolamida es un inhibidor de la anhidrasa carbónica."}, {"topic": "Farmacología", "q": "Paciente nota crecimiento de pestañas y cambios en la pigmentación del iris. ¿Qué medicamento puede explicarlo?", "a": ["Timolol", "Dorzolamida", "Latanoprost", "Brimonidina"], "c": 2, "e": "Los análogos de prostaglandinas como latanoprost pueden producir cambios de pigmentación del iris y crecimiento de pestañas."}, {"topic": "Farmacología", "q": "Un colirio aumenta la salida uveoescleral y otro reduce la producción de humor acuoso mediante bloqueo β. ¿Cuál combinación corresponde?", "a": ["Latanoprost + Timolol", "Timolol + Latanoprost", "Dorzolamida + Brimonidina", "Brimonidina + Pilocarpina"], "c": 0, "e": "Latanoprost aumenta la salida uveoescleral; timolol reduce la producción de humor acuoso mediante bloqueo beta."}, {"topic": "Córnea · Queratocono", "q": "Paciente de 21 años con disminución visual progresiva, cambios frecuentes de receta y dificultad para obtener buena visión con anteojos. Revisa las queratometrías de AO y decide la principal sospecha diagnóstica.", "a": ["Astigmatismo regular bilateral fisiológico", "Degeneración macular asociada a la edad", "Queratocono, con mayor sospecha en OD", "Glaucoma primario de ángulo abierto"], "c": 2, "e": "El OD muestra queratometrías elevadas y mayor diferencia entre meridianos. Junto con la historia clínica, hace sospechar queratocono; la queratometría aislada no confirma el diagnóstico."}, {"topic": "Campo visual", "q": "Paciente con glaucoma presenta un defecto arcuato superior que respeta el meridiano horizontal. ¿Interpretación más adecuada?", "a": ["Compatible con daño glaucomatoso; correlacionar con estructura y evolución", "Diagnóstico de lesión quiasmática", "Descarta glaucoma", "Exclusivo de patología macular"], "c": 0, "e": "Los defectos arcuatos y el escalón nasal son patrones compatibles con daño glaucomatoso."}, {"topic": "Urgencia", "q": "Paciente de 60 años con ojo rojo, dolor intenso, visión borrosa, halos, cefalea, náuseas y PIO muy elevada. ¿Sospecha prioritaria?", "a": ["Conjuntivitis aguda", "Uveítis anterior", "Ataque agudo por cierre angular", "Hemorragia subconjuntival"], "c": 2, "e": "Este conjunto de signos y síntomas obliga a sospechar un ataque agudo por cierre angular."}, {"topic": "Retina", "q": "¿Qué hallazgo permite clasificar una retinopatía diabética como proliferativa?", "a": ["Microaneurismas aislados", "Exudados duros", "Hemorragias intrarretinales", "Neovascularización retinal o del disco óptico"], "c": 3, "e": "La neovascularización retinal y/o del disco óptico define la etapa proliferativa."}, {"topic": "Integración", "q": "Mujer de 69 años presenta disminución visual unilateral y dolor ocular. AV OD 20/200, OI 20/25; OD con semimidriasis poco reactiva; PIO OD 58 mmHg y OI 16 mmHg. ¿Cuál es la conducta más adecuada?", "a": ["Control oftalmológico electivo en 30 días", "Indicar lubricantes y observar evolución", "Manejo oftalmológico urgente para disminuir la PIO y resolver el cierre angular", "Indicar corrección óptica y reevaluar"], "c": 2, "e": "Los hallazgos son compatibles con un ataque agudo por cierre angular y requieren manejo oftalmológico urgente."}];let i=0,lives=3,score=0,correct=0,secs=45,clock=null,locked=false,student="",rank=true;
function startGame(){student=document.getElementById("name").value.trim()||"Estudiante";rank=document.getElementById("ranking").checked;document.getElementById("start").classList.add("hidden");document.getElementById("game").classList.remove("hidden");render()}
function render(){locked=false;secs=45;const x=Q[i];document.getElementById("qnum").textContent=`Pregunta ${i+1} de ${Q.length}`;document.getElementById("hearts").textContent="♥".repeat(lives)+"♡".repeat(3-lives);document.getElementById("progress").style.width=((i+1)/Q.length*100)+"%";document.getElementById("topic").textContent=x.topic;document.getElementById("question").textContent=x.q;document.getElementById("feedback").style.display="none";let sp=document.getElementById("special");sp.innerHTML="";if(i===15){sp.innerHTML='<button id="kbtn" class="kbtn" onclick="showK()">📐 VER QUERATOMETRÍAS DE AO</button><div id="kdata" class="kgrid hidden"><div class="k"><strong>OD</strong>K1 46,75 D<br>K2 50,25 D</div><div class="k"><strong>OI</strong>K1 43,50 D<br>K2 44,75 D</div></div>'}const a=document.getElementById("answers");a.innerHTML="";x.a.forEach((z,j)=>{let b=document.createElement("button");b.className="ans";b.innerHTML="<b>"+String.fromCharCode(65+j)+")</b> "+z;b.onclick=()=>answer(j,b);a.appendChild(b)});clearInterval(clock);tick();clock=setInterval(()=>{secs--;tick();if(secs<=0){clearInterval(clock);timeout()}},1000)}
function showK(){document.getElementById("kdata").classList.remove("hidden");document.getElementById("kbtn").classList.add("hidden")}
function tick(){document.getElementById("timer").textContent="◷ "+secs+" s"}
function answer(j,b){if(locked)return;locked=true;clearInterval(clock);const x=Q[i],bs=[...document.querySelectorAll(".ans")];bs.forEach((z,k)=>{z.disabled=true;if(k===x.c)z.classList.add("correct")});if(j===x.c){score+=100;correct++;tone();feedback(true,x.e)}else{lives=Math.max(0,lives-1);document.getElementById("hearts").textContent="♥".repeat(lives)+"♡".repeat(3-lives);b.classList.add("wrong");horn();feedback(false,x.e)}}
function timeout(){if(locked)return;locked=true;lives=Math.max(0,lives-1);document.getElementById("hearts").textContent="♥".repeat(lives)+"♡".repeat(3-lives);[...document.querySelectorAll(".ans")].forEach((z,k)=>{z.disabled=true;if(k===Q[i].c)z.classList.add("correct")});horn();feedback(false,"Se acabó el tiempo. "+Q[i].e)}
function feedback(ok,e){document.getElementById("fbtitle").textContent=ok?"🐱🎉 ¡Excelente decisión clínica! +100 puntos":"✕ Respuesta incorrecta";document.getElementById("fbtext").textContent=e;document.getElementById("feedback").style.display="block"}
function nextQuestion(){i++;i>=Q.length?finish():render()}
function finish(){clearInterval(clock);document.getElementById("game").classList.add("hidden");document.getElementById("end").classList.remove("hidden");document.getElementById("student").textContent=student;document.getElementById("score").textContent=score+" pts";document.getElementById("summary").textContent=`${correct} de ${Q.length} correctas · ${Math.round(correct/Q.length*100)}%`;document.getElementById("rankend").innerHTML=rank?"<b>🏆 Participación en ranking activada</b><br>Tu resultado está preparado para conectarse al Ranking UAPO LAB.":"<b>Modo sin ranking</b><br>Este resultado no participará en el ranking."}
function tone(){try{let a=new(window.AudioContext||window.webkitAudioContext)();[523,659,784].forEach((f,k)=>{let o=a.createOscillator(),g=a.createGain();o.frequency.value=f;o.connect(g);g.connect(a.destination);g.gain.value=.04;o.start(a.currentTime+k*.08);o.stop(a.currentTime+.17+k*.08)})}catch(e){}}
function horn(){try{let a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator(),g=a.createGain();o.type="sawtooth";o.frequency.value=170;o.connect(g);g.connect(a.destination);g.gain.value=.05;o.start();o.stop(a.currentTime+.38)}catch(e){}}
</script></body></html>
